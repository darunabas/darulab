{% if author.impactstory %}
<li>
  <a href="https://impactstory.org/u/{{ author.impactstory }}">
    <i class="ai ai-impactstory" aria-hidden="true"></i> Impactstory
  </a>
</li>
{% endif %}

{% if author.googlescholar %}
<li>
  <a target="_blank" rel="noopener noreferrer" href="https://scholar.google.com/citations?user={{ author.googlescholar }}" title="Google Scholar">
    <i class="fab fa-fw fa-google-scholar" aria-hidden="true"></i><span class="label">Google Scholar</span>
  </a>
</li>
{% endif %}

{% if author.orcid %}
<li>
  <a target="_blank" rel="noopener noreferrer" href="https://orcid.org/{{ author.orcid }}" title="ORCiD">
    <i class="fab fa-fw fa-orcid" aria-hidden="true"></i><span class="label">ORCiD</span>
  </a>
</li>
{% endif %}

<li class="author__project">
  <a target="_blank" rel="noopener" href="https://greenmaps.net" title="GreenMaps: predicted native ranges of the world's plants">
    <img class="author__icon-img" src="/assets/images/greenmaps-icon.png" alt="" aria-hidden="true"><span class="label">GreenMaps</span>
  </a>
</li>

<li class="author__project">
  <a target="_blank" rel="noopener" href="https://phyloregion.com" title="phyloregion R package">
    <img class="author__icon-img" src="/assets/images/phyloregion-icon.png" alt="" aria-hidden="true"><span class="label">phyloregion</span>
  </a>
</li>
